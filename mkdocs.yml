site_name: ProEthica Documentation
site_description: User manual for ProEthica - Professional Ethics Analysis Tool
site_url: https://proethica.org/docs

# ANONYMOUS REVIEW (AAAI-27, through 2026-11-30): site_author and the repository
# settings below are withheld. site_author emits a <meta name="author"> tag on
# every page; repo_url adds a header link and per-page "edit" links that name the
# account. MkDocs is built statically, so these cannot be gated by
# config.ANONYMOUS_MODE at request time; restore them from
# docs-internal/anonymization-restore-2026-07.md at camera-ready.
#
# site_author: Christopher B. Rauch
#
# Repository
# repo_url: https://github.com/cr625/proethica
# repo_name: proethica
# edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Light mode (default)
    - scheme: default
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

  icon:
    logo: material/scale-balance
    repo: fontawesome/brands/github

  font:
    text: Segoe UI
    code: Roboto Mono

plugins:
  - search:
      lang: en

# ANONYMOUS REVIEW (AAAI-27, through 2026-11-30): keep the publications page and
# the conference PDFs out of the build entirely. Excluding rather than
# route-gating is deliberate -- the PDFs carry author names and affiliations on
# their title pages, and a built-but-blocked page would still contribute its text
# to the search index. Delete this block at camera-ready.
exclude_docs: |
  papers/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Welcome: getting-started/welcome.md
      - Interface Overview: getting-started/first-login.md
  - Concepts:
      - Nine-Component Framework: concepts/nine-components.md
      - Pipeline Terminology: concepts/terminology.md
      - Ontology Properties: concepts/ontology-properties.md
      - Color Scheme: concepts/color-scheme.md
  - Viewing:
      - Browsing Cases: viewing/browsing-cases.md
      - Viewing Extractions: viewing/viewing-extractions.md
      - Precedent Network: viewing/precedent-network.md
      - Defeasibility View: viewing/defeasibility.md
      - Interactive Scenario: viewing/interactive-scenario.md
      - Guidelines: viewing/guidelines.md
  - Analysis:
      - Running Extractions: analysis/running-extractions.md
      - Entity Review: analysis/entity-review.md
      - Pipeline Automation: analysis/pipeline-automation.md
      - Uploading Cases: analysis/uploading-cases.md
  - Administration:
      - Overview: admin-guide/index.md
      - Prompt Editor: admin-guide/prompt-editor.md
      - Pipeline Management: admin-guide/pipeline-management.md
      - User Management: admin-guide/user-management.md
      - Service Health: admin-guide/health-dashboard.md
      - Architecture: admin-guide/architecture.md
      - Installation: admin-guide/installation.md
      - Ontology Integration: admin-guide/ontology-integration.md
      - Production Server: admin-guide/production-server.md
      - Settings: admin-guide/settings.md
  - References: references.md
  # ANONYMOUS REVIEW (AAAI-27): the publications page lists the authors by name
  # across every prior paper. Removed from the nav AND excluded from the build
  # below, because a nav-only removal would leave the page text in the Material
  # search index at /docs/search/search_index.json.
  # - Publications: papers/index.md
  - "Back to ProEthica": "/"

extra_css:
  - assets/css/custom.css

